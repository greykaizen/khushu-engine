name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Binary API check
        run: ./gradlew apiCheck --no-daemon

      - name: Audit — no Android/UI deps under engine/
        run: |
          if grep -rn "import android\|import androidx\|java.awt\|javax.swing" engine/*/src/main --include="*.kt"; then
            echo "::error::Forbidden imports found in engine/"
            exit 1
          fi
